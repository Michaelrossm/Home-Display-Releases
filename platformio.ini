; Home-Display ESP32-P4 v0.3.2
; Waveshare ESP32-P4-WIFI6-POE-ETH-D + 10.1" DSI Touch A
; pioarduino 55.03.311 / Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5
; Revision profiles: waveshare_home_display_p4_r3 is 400 MHz; legacy is 360 MHz.
;
; python tools/dev.py doctor
; python tools/dev.py test
; python tools/dev.py build

[platformio]
; Keep the pinned pioarduino toolchain independent of other ESP32 projects.
; No global framework replacement or version-suffixed package cleanup.
core_dir = .pio/core
default_envs = home_display_p4_legacy_dev
src_dir = src
include_dir = include
data_dir = data
boards_dir = boards

[env]
; Opt-in only until the intercom feature has completed hardware validation.
custom_intercom_enabled = 0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_32mb.csv
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_compat_mode = soft
lib_ignore = NetworkClientSecure

; Read-only validation before every PlatformIO build.
extra_scripts =
    pre:tools/prebuild_app_cleanup.py

lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -include esp_random.h
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D BOARD_HAS_PSRAM
    ; The Lua component's long-long detection misfires for this cross toolchain;
    ; 32-bit Lua numbers are plenty for small script-driven app screens.
    -D LUA_32BITS=1
    -D HOMEDISPLAY_USE_WAVESHARE_BSP=1
    -D HOMEPANEL_HOSTNAME=\"home-display\"
    -D HOMEPANEL_DISPLAY_WIDTH=1280
    -D HOMEPANEL_DISPLAY_HEIGHT=800
    -D HOMEDISPLAY_NATIVE_PANEL_WIDTH=800
    -D HOMEDISPLAY_NATIVE_PANEL_HEIGHT=1280
    -D HOMEDISPLAY_SCREEN_10_1_DSI_TOUCH_A=1
    -D HOMEPANEL_FEATURE_SD=1
    -D HOMEPANEL_FEATURE_MDNS=1
    -D HOMEPANEL_FEATURE_OTA=1
    -D HOMEPANEL_FEATURE_RADIO=1
    -D HOMEPANEL_FEATURE_WEATHER=1
    -D HOMEPANEL_FEATURE_POWER=1
    -D HOMEPANEL_FEATURE_CALENDAR=1
    -D HOMEPANEL_FEATURE_WALLPAPER=1
    -D HOMEPANEL_AUDIO_BACKEND_ESP_AUDIO_PLAYER=1
    -D HOMEPANEL_FEATURE_AMBIENT_LIGHT=1
    -D HOMEPANEL_FEATURE_WEBAPPS=1
    -D HOMEPANEL_FEATURE_MUSIC=1
    -D HOMEPANEL_CALENDAR_MAX_PERSONS=16
    -D HOMEPANEL_CALENDAR_MAX_CALENDARS=32
    -D HOMEPANEL_CALENDAR_UPCOMING_CACHE=32
    -D HOMEPANEL_FEATURE_POWER_MANAGEMENT=1
    -D HOMEPANEL_POWER_ALLOW_LIGHT_SLEEP=0
    -D HOMEPANEL_FEATURE_VOICE=0
    -D HOMEPANEL_FEATURE_INTERCOM=${env.custom_intercom_enabled}
    -D HOMEPANEL_FEATURE_DYNAMIC_APPS=1
    -D HOMEPANEL_REQUIRE_HTTPS_OTA=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_USE_QRCODE=1
    -D LVGL_PORT_PPA_MAX_PENDING_TRANS=8
    -Wno-error=conversion
    -Wno-error=sign-conversion
    -Wno-error=deprecated-declarations
    -I include

[env:home_display_p4_r3_dev]
; Revision profiles describe the binary, not the currently connected device.
board = waveshare_home_display_p4_r3
build_flags =
    ${env.build_flags}
    -D HOMEPANEL_P4_PROFILE_R3=1
    -D HOMEDISPLAY_DEVELOPMENT=1
    -D CORE_DEBUG_LEVEL=3

[env:home_display_p4_r3_prod]
board = waveshare_home_display_p4_r3
build_flags =
    ${env.build_flags}
    -D HOMEPANEL_P4_PROFILE_R3=1
    -D HOMEDISPLAY_PRODUCTION=1

[env:home_display_p4_legacy_dev]
board = waveshare_home_display_p4_legacy
build_flags =
    ${env.build_flags}
    -D HOMEPANEL_P4_PROFILE_LEGACY=1
    -D HOMEDISPLAY_DEVELOPMENT=1
    -D CORE_DEBUG_LEVEL=3

[env:home_display_p4_legacy_prod]
board = waveshare_home_display_p4_legacy
build_flags =
    ${env.build_flags}
    -D HOMEPANEL_P4_PROFILE_LEGACY=1
    -D HOMEDISPLAY_PRODUCTION=1
