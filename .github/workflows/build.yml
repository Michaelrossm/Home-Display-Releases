name: Home Display build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project toolchain
        run: python tools/dev.py setup
      - name: Verify environment
        run: python tools/dev.py doctor
      - name: Run tests
        run: python tools/dev.py test
      - name: Run source validation
        run: python tools/dev.py validate
      - name: Build 360 MHz production firmware
        run: python tools/dev.py build --env home_display_p4_legacy_prod
      - name: Verify production sources
        run: python tools/dev.py validate --production
      # No automatic firmware upload, release creation or hardware flashing.
      # P4 v3.x / 400 MHz is not advertised as a tested download in 0.1.0.
