name: Home-Display P4 regression tests
on:
  workflow_dispatch:

jobs:
  regression-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require complete firmware project
        run: test -f platformio.ini
      - name: Install PlatformIO
        run: python -m pip install -r requirements-dev.txt
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: .pio/core
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/**', 'sdkconfig.defaults', 'partitions_32mb.csv') }}
      - name: Build the 360 MHz pre-v3 ESP32-P4 firmware
        run: python tools/dev.py build --env home_display_p4_legacy_dev
      - name: Structural and regression checks
        run: python tools/run_checks.py --no-build
