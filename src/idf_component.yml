dependencies:
  espressif/usb_host_msc:
    version: "1.1.4"
    require: public
  idf:
    version: ">=5.5.0,<5.6.0"

  waveshare/esp32_p4_platform:
    version: "2.0.1"

  lvgl/lvgl:
    version: "9.3.0"

  chmorgan/esp-audio-player:
    version: "1.1.0"

  chmorgan/esp-libhelix-mp3:
