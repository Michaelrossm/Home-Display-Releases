[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM5
upload_port = COM5
# Langsamer, dafuer bei CP210x-Boards und langen USB-Kabeln robuster.
upload_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
